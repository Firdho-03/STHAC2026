<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Juri & Admin — STHAC Live Scoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white font-['Plus_Jakarta_Sans'] min-h-screen p-6">
  <div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-8">
      <div>
        <span class="text-xs uppercase tracking-widest text-amber-400 font-bold">Official Judge Console</span>
        <h1 class="text-2xl font-bold">Input Skor Real-Time (Satu RUN)</h1>
      </div>
      <a href="/" target="_blank" class="text-xs bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl">Buka Website Utama &rarr;</a>
    </div>

    <form id="judge-form" class="bg-slate-800 p-6 rounded-2xl border border-white/10 space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Pilih Rider</label>
          <select id="riderSelect" name="riderId" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm"></select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Seri Kejuaraan</label>
          <select name="seriId" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm">
            <option value="1">Seri 1 — Opening Series</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Run Ke-</label>
          <select name="runNumber" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm">
            <option value="1">Run 1</option>
            <option value="2">Run 2</option>
            <option value="3">Run 3</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Kelas Pertandingan</label>
          <input type="text" name="kelas" value="Korean Track 90m - Senior Pro" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Batas Waktu Maksimal (Detik)</label>
          <input type="number" step="0.01" name="batasWaktu" value="14.00" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm" />
        </div>
      </div>

      <div class="grid grid-cols-4 gap-3 pt-2">
        <div>
          <label class="block text-xs text-amber-400 font-bold mb-1">Target 1 (0-5)</label>
          <input type="number" min="0" max="5" name="target1" value="5" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-center font-bold text-lg" />
        </div>
        <div>
          <label class="block text-xs text-amber-400 font-bold mb-1">Target 2 (0-5)</label>
          <input type="number" min="0" max="5" name="target2" value="4" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-center font-bold text-lg" />
        </div>
        <div>
          <label class="block text-xs text-amber-400 font-bold mb-1">Target 3 (0-5)</label>
          <input type="number" min="0" max="5" name="target3" value="5" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-center font-bold text-lg" />
        </div>
        <div>
          <label class="block text-xs text-emerald-400 font-bold mb-1">Waktu (Detik)</label>
          <input type="number" step="0.01" name="waktuTempuh" required value="10.85" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-emerald-600 text-center font-bold text-lg text-emerald-400" />
        </div>
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition">
        Simpan & Pancarkan ke Live Papan Skor Sekarang
      </button>
    </form>
  </div>

  <script>
    async function loadRiders() {
      const res = await fetch('/api/profiles');
      const data = await res.json();
      const sel = document.getElementById('riderSelect');
      sel.innerHTML = data.riders.map(r => `<option value="${r.id}">${r.namaLengkap} (${r.asalStable})</option>`).join('');
    }
    loadRiders();

    document.getElementById('judge-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch('/api/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      });
      const result = await res.json();
      if (result.success) {
        alert('Skor berhasil dipancarkan! Total Skor Run: ' + result.data.totalSkor);
      } else {
        alert('Gagal menyimpan: ' + result.error);
      }
    });
  </script>
</body>
</html>
